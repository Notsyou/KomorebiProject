---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: komorebi-frontend
  labels:
    app: komorebi-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: komorebi-frontend
  template:
    metadata:
      labels:
        app: komorebi-frontend
    spec:
      containers:
      - name: komorebi-frontend
        image: komorebi-frontend:latest # Replace with your actual Docker image name/tag
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: LoadBalancer # Exposes the frontend to your local machine/internet
  selector:
    app: komorebi-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80