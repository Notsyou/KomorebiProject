---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: komorebi-backend
  labels:
    app: komorebi-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: komorebi-backend
  template:
    metadata:
      labels:
        app: komorebi-backend
    spec:
      containers:
      - name: komorebi-backend
        image: komorebi-backend:latest # Replace with your actual Docker image name/tag
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: DB_HOST
          value: "mysql-service" # Points to your existing MySQL K8s service
        - name: DB_USER
          value: "komorebi_user"
        - name: DB_PASSWORD
          value: "komorebipassword"
        - name: DB_NAME
          value: "komorebi_maps"
        - name: JWT_SECRET
          value: "supersecretlocaltoken"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: ClusterIP
  selector:
    app: komorebi-backend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000