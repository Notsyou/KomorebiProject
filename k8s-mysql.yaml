---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  labels:
    app: komorebi-mysql
spec:
  ports:
    - port: 3306
  clusterIP: None
  selector:
    app: komorebi-mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  selector:
    matchLabels:
      app: komorebi-mysql
  serviceName: mysql-service
  replicas: 1
  template:
    metadata:
      labels:
        app: komorebi-mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secrets
              key: root-password
        ports:
        - containerPort: 3306
          name: mysql
        volumeMounts:
        - name: mysql-persistent-storage
          mountPath: /var/lib/mysql
  volumeClaimTemplates:
  - metadata:
      name: mysql-persistent-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi