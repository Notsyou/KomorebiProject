version: '3.8'

networks:
  komorebi_net:
    driver: bridge

services:
  db:
    image: mysql:8.0
    container_name: komorebi_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: komorebi_maps
      MYSQL_USER: komorebi_user
      MYSQL_PASSWORD: ${DB_APP_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
    networks:
      - komorebi_net
    # 👇 Moved healthcheck to the actual database container
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: komorebi_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - komorebi_net
      
  backend:
    build: .
    container_name: komorebi_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=komorebi_user
      - DB_PASSWORD=${DB_APP_PASSWORD}
      - DB_NAME=komorebi_maps
      - JWT_SECRET=${JWT_SECRET_KEY}
    # 👇 Fixed the object syntax format here
    depends_on:
      db:
        condition: service_healthy
    networks:
      - komorebi_net

  frontend:
    image: nginx:alpine
    container_name: komorebi_frontend
    restart: unless-stopped
    ports:
      - "5500:80"
    volumes:
      - ./public:/usr/share/nginx/html # 👈 CRITICAL: Added /public here
    networks:
      - komorebi_net

volumes:
  db_data: